
workflows:
  default-workflow:
    name: Behaj Tasbih Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Check project files
        script: |
          echo "Checking Behaj Tasbih project..."
          pwd
          ls -la
          ls -la lib
          test -f lib/main.dart
          test -f pubspec.yaml

      - name: Restore Android project setup
        script: |
          flutter create --platforms=android .

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
