workflows:
  default-workflow:
    name: Behaj Tasbih Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Inspect GitHub project structure
        script: |
          echo "Current directory:"
          pwd

          echo "Files in repository:"
          ls -la

          echo "Searching for main.dart:"
          find . -name main.dart -type f

          echo "Checking Android folder:"
          if [ -d android ]; then
            ls -la android
          else
            echo "ERROR: android is missing or is not a directory"
          fi

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
