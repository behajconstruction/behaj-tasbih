workflows:
  default-workflow:
    name: Behaj Tasbih Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Locate Flutter project
        script: |
          echo "CURRENT DIRECTORY"
          pwd

          echo "ROOT FILES"
          ls -la

          echo "FILES INSIDE LIB"
          ls -la lib || true

          echo "FIND MAIN DART"
          find . -type f -name main.dart -print

          echo "FIND PUBSPEC"
          find . -type f -name pubspec.yaml -print

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
